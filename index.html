<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlcatrazCODM | پنل گیمینگ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b16;--panel:#081326;--panel2:#0d1a30;--line:#15365a;--blue:#00c8ff;--cyan:#50e4ff;--purple:#a34cff;--text:#edf6ff;--muted:#8ea6c5;--green:#39dfa0;--gold:#ffc857}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#12355a 0,transparent 55%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;font-size:13px}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.topbar{height:72px;position:sticky;top:0;z-index:20;background:#050c18ed;border-bottom:1px solid #12365c;backdrop-filter:blur(14px)}
.top-inner{max-width:1600px;margin:auto;height:100%;padding:0 22px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;min-width:230px}
.brand-mark{width:43px;height:43px;border:2px solid var(--blue);border-radius:12px;display:grid;place-items:center;color:var(--blue);font-size:24px;box-shadow:0 0 18px #00c8ff26}
.brand b{font-size:18px;letter-spacing:.3px}
.brand small{display:block;color:var(--blue);font-size:9px;letter-spacing:2px}
.nav{display:flex;align-items:center;gap:4px;flex:1}
.nav a{padding:12px 14px;color:#b9cbe2;border-radius:9px;white-space:nowrap}
.nav a.active,.nav a:hover{color:var(--cyan);background:#092849}
.search{width:220px;position:relative}
.search input{width:100%;border:1px solid #183b62;background:#071225;color:white;border-radius:24px;padding:10px 15px;outline:none}
.search input:focus{border-color:var(--blue)}
.icon-btn{background:transparent;border:0;color:#c4d9f3;font-size:21px;padding:6px}
.user-mini{display:flex;align-items:center;gap:9px;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#164f79,#512a79);border:1px solid #438ac0;font-size:18px}
.user-mini strong{display:block}
.user-mini small{color:var(--cyan)}
.layout{max-width:1600px;margin:0 auto;padding:16px 20px;display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:14px}
.side,.panel{background:linear-gradient(145deg,#08152aee,#061020f5);border:1px solid #12365a;border-radius:13px;overflow:hidden}
.side{padding:13px;height:max-content}
.side-title{color:#b6cce6;font-weight:700;margin:3px 5px 12px}
.quick a{display:flex;justify-content:space-between;align-items:center;padding:11px 9px;color:#9db5d4;border-radius:8px}
.quick a:hover{background:#102440;color:var(--cyan)}
.quick i{font-style:normal;font-size:17px}
.promo{margin-top:13px;border:1px solid #16446a;border-radius:11px;overflow:hidden;background:linear-gradient(145deg,#122a46,#081222)}
.promo-art{height:105px;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle,#315c76,#10213a 70%)}
.promo-body{text-align:center;padding:11px}
.promo-body b{font-size:15px}
.promo-body p{color:var(--muted);font-size:11px;margin:5px 0}
.support{padding:16px 10px;text-align:center;color:#9eb4d0;line-height:1.9}
.support strong{display:block;color:var(--cyan);font-size:14px}
.main{min-width:0}
.hero{height:205px;border:1px solid #155184;border-radius:13px;overflow:hidden;position:relative;background:linear-gradient(90deg,#07101beF 0%,#081426b0 48%,#08142625 100%),url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1500&q=85') center 45%/cover;display:flex;align-items:center;padding:24px}
.hero-copy{max-width:480px;position:relative;z-index:1}
.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:2px;font-weight:800}
.hero h1{font-size:29px;line-height:1.5;margin:7px 0}
.hero h1 span{color:var(--blue)}
.hero p{color:#c3d4e9;margin:0;line-height:1.8}
.hero-actions{display:flex;gap:8px;margin-top:14px}
.btn{border:1px solid #1479b2;background:linear-gradient(110deg,#087cbd,#00c8ff);color:#03101d;font-weight:800;border-radius:7px;padding:9px 14px}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:#0a1b30;color:#c6eaff;border-color:#23537b}
.btn.purple{background:linear-gradient(110deg,#6c35b4,#a34cff);border-color:#a34cff;color:white}
.section{margin-top:13px;padding:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-head h2{font-size:15px;margin:0}
.section-head h2 em{font-style:normal;color:var(--gold);margin-left:6px}
.link{color:var(--cyan);font-size:11px}
.tourney-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.tour-card{border:1px solid #17466d;border-radius:9px;overflow:hidden;background:#071326;min-width:0}
.tour-card:nth-child(3n){border-color:#5a3b8c}
.tour-image{height:76px;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 50% 30%,#2b5679,#101a31 75%);position:relative}
.tour-image:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07132688,transparent)}
.tour-image span{z-index:1}
.mode{position:absolute;bottom:5px;right:6px;z-index:2;font-size:9px;background:#082c48;border:1px solid #1686bb;border-radius:4px;padding:2px 5px}
.tour-body{padding:8px}
.tour-body b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour-body small{display:block;color:#9db4d2;font-size:9px;margin:5px 0 8px}
.tour-bottom{display:flex;align-items:center;justify-content:space-between;gap:4px}
.tour-bottom .btn{padding:6px 10px;font-size:10px}
.tiny{font-size:9px;color:var(--cyan)}
     </style>
